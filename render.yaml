services:
  - type: web
    name: watch-party-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*.vercel.app"
      - key: MONGODB_URI
        sync: false
